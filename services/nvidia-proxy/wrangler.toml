# D-H (2026-07-14, README D143): async job-queue redesign. Cloudflare's free-tier edge
# gives up after ~100-125s of silence on a single request/response, but NVIDIA build-tier
# models normally take up to several minutes under load (see cli/vendor/nvidia/nvidia_client.py's
# DEFAULT_TIMEOUT_S=600 and its D98 history) -- no client-facing request can survive that
# wait no matter how it's coded. This decouples the two: the client's HTTP request returns
# almost instantly with a job_id: the actual NVIDIA call happens in a Queue consumer
# invocation, which gets up to 15 minutes wall-clock (Cloudflare's documented queue
# consumer limit) with no penalty for I/O wait time. The client polls for the result.
#
# Ported from popixoxipop-collab/Code_reviewer_with_feedback for standalone deployability
# (docs/lab/curriculum-manager/README.md's 자체 배포 section), then deployed as its own
# dedicated Worker (2026-07-21) -- `name`/kv id/queue name below are deliberately NOT the
# same as that repo's ("nvidia-proxy"/"nvidia-jobs-queue"): both are account-scoped in
# Cloudflare, and this is the SAME Cloudflare account (popixoxipop@gmail.com) as the
# original, so reusing those names would have overwritten/collided with the shared team
# worker Code_reviewer_with_feedback still depends on instead of creating a separate one.
# No NVIDIA API key secret is configured here -- the worker is stateless about it,
# forwarding whatever `x-nvidia-api-key` header the caller sends (see
# nvidia-proxy.js:213-214), which is each user's own key typed into the page's settings
# panel, never stored server-side.
name = "team-iz-nvidia-proxy"
main = "nvidia-proxy.js"
compatibility_date = "2026-07-14"

kv_namespaces = [
  { binding = "NVIDIA_JOBS", id = "8264aea6898c4d4ca60f1263b62d6a9b" }
]

[[durable_objects.bindings]]
name = "NVIDIA_RATE_LIMITER"
class_name = "NvidiaRateLimiter"

[[migrations]]
tag = "v1-nvidia-rate-limiter"
new_sqlite_classes = ["NvidiaRateLimiter"]

[[queues.producers]]
queue = "team-iz-nvidia-jobs-queue"
binding = "NVIDIA_JOBS_QUEUE"

[[queues.consumers]]
queue = "team-iz-nvidia-jobs-queue"
max_batch_size = 1
max_batch_timeout = 1

[vars]
# Stay below NVIDIA Build's observed 40 RPM ceiling. The Durable Object enforces one
# proxy-global schedule across every key and concurrent curriculum run.
NVIDIA_RPM_LIMIT = "36"
LANGSMITH_ENDPOINT = "https://api.smith.langchain.com"
LANGSMITH_PROJECT = "team-iz-nvidia-usage"
# D-ls-workspace (2026-07-30): considered giving pdf_analysis/code_Q&A/poc_full each
# their own LangSmith Workspace (stronger isolation than a project name -- separate
# billing/RBAC boundary) instead of just separate LANGSMITH_PROJECT values in one
# workspace. Confirmed live against the API: `POST /api/v1/workspaces` on this org
# returns `{"detail":"Personal organizations cannot create workspaces."}` -- Personal
# orgs are hard-blocked regardless of the caller's role/permission.
#   WHY: converting to (or creating) a Shared organization requires adding a credit
#     card and, per LangSmith's pricing, a paid seat per member -- a billing decision,
#     not a config change, so it's out of scope here.
#   COST: three pipelines share one workspace's RBAC/billing boundary instead of each
#     getting its own -- acceptable since LANGSMITH_PROJECT already gives each pipeline
#     its own filterable project/dashboard, which was the actual ask (pick a pipeline
#     and see only its traces).
#   EXIT: if a Shared org is ever set up (billing added), `POST /api/v1/workspaces`
#     with an Organization Admin/Operator-scoped Personal Access Token works (verified
#     schema: {"display_name": "<name>"}) -- create one workspace per pipeline, then add
#     LANGSMITH_WORKSPACE_ID here (sendLangSmithTrace already reads it and sends
#     x-tenant-id -- no code change needed, just this var).
LANGSMITH_ORGANIZATION_ID = "63acea55-f27c-429b-850f-63fb363f56b1"
# D-ls-tags: per-Worker tag override so the shared nvidia-proxy.js's hardcoded fallback
# ("nvidia,curriculum-manager,production") doesn't need to change when code_Q&A/poc_full
# each set their own here instead.
LANGSMITH_TAGS = "nvidia,curriculum-manager,production"
# MiniMax M3 GMI Cloud serverless rate shown in the deployment pricing table.
MODEL_INPUT_USD_PER_MILLION = "0.24"
MODEL_OUTPUT_USD_PER_MILLION = "0.96"
MODEL_PRICING_BASIS = "gmi-cloud-serverless-2026-07-29"
