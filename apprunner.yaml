# AWS App Runner 배포 설정 (PLAN_FASTAPI_MIGRATION.md §T9c)
#
# App Runner가 `main` 브랜치를 직접 물고 빌드·배포한다 — Dockerfile·ECR·Actions 없음.
# 관리형 런타임이라 시스템 패키지(poppler 등)를 못 깐다. 그래서 의존성은 전부 순수 wheel이다.
#
# runtime: python311 (python3 아님) — Python 3.11 "revised build"를 쓰려면 이 정확한 값이 필요하다.
# revised build는 build 단계에서 /app 밖에 설치한 건 전부 버리므로(pip install은 site-packages에
# 깔림, /app 안이 아님), 실제 설치는 run.pre-run에서 한다. build 단계의 pip install은 유지하되
# 그 결과는 버려진다는 걸 알고 둔 것 — AWS 공식 예제(Python 3.11 extended config)도 같은 패턴.
#
# 환경변수·시크릿은 이 파일의 run.env/run.secrets로 관리한다(콘솔 수동설정 방식에서 전환, 2026-08-03).
# secrets의 value-from은 Secrets Manager 시크릿(teamiz-ai/apprunner-env)의 JSON 키를 개별 참조—
# 실제 값은 이 파일에 없다. App Runner 서비스의 InstanceRoleArn에 secretsmanager:GetSecretValue
# 권한이 있어야 한다(이미 부여됨: teamiz-ai-apprunner-instance-role).
# APP_ENV=production인데 INTERNAL_API_KEY가 비면 앱이 import 단계에서 죽는다(배포 실패로 보인다).
#
# 콘솔에서 별도로 잡아야 하는 것:
#   헬스체크 경로 = /api/health (인증 면제)
#   오토스케일 max instances = 1 — job·세션이 인메모리 dict라 2개로 늘면 폴링이 404가 난다
version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip3 install -r requirements.txt
run:
  runtime-version: 3.11
  pre-run:
    - pip3 install -r requirements.txt
  command: python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8080
  network:
    port: 8080
  env:
    - name: APP_ENV
      value: "production"
    - name: ENGINE_MODE
      value: "real"
    - name: MODEL_CODE_ANALYSIS
      value: "nvidia/nemotron-3-ultra-550b-a55b"
    - name: MODEL_CODE_SESSION
      value: "mistralai/mistral-medium-3.5-128b"
    - name: MODEL_CODE_CURRICULUM
      value: "minimaxai/minimax-m3"
  secrets:
    - name: INTERNAL_API_KEY
      value-from: "arn:aws:secretsmanager:ap-northeast-1:357457230521:secret:teamiz-ai/apprunner-env-0weS1b:INTERNAL_API_KEY::"
    - name: NVIDIA_API_KEY_1
      value-from: "arn:aws:secretsmanager:ap-northeast-1:357457230521:secret:teamiz-ai/apprunner-env-0weS1b:NVIDIA_API_KEY_1::"
    - name: NVIDIA_API_KEY_2
      value-from: "arn:aws:secretsmanager:ap-northeast-1:357457230521:secret:teamiz-ai/apprunner-env-0weS1b:NVIDIA_API_KEY_2::"
    - name: NVIDIA_API_KEY_3
      value-from: "arn:aws:secretsmanager:ap-northeast-1:357457230521:secret:teamiz-ai/apprunner-env-0weS1b:NVIDIA_API_KEY_3::"
    - name: NVIDIA_API_KEY_4
      value-from: "arn:aws:secretsmanager:ap-northeast-1:357457230521:secret:teamiz-ai/apprunner-env-0weS1b:NVIDIA_API_KEY_4::"
    - name: NVIDIA_API_KEY_5
      value-from: "arn:aws:secretsmanager:ap-northeast-1:357457230521:secret:teamiz-ai/apprunner-env-0weS1b:NVIDIA_API_KEY_5::"
    - name: NVIDIA_API_KEY_6
      value-from: "arn:aws:secretsmanager:ap-northeast-1:357457230521:secret:teamiz-ai/apprunner-env-0weS1b:NVIDIA_API_KEY_6::"
    - name: NVIDIA_API_KEY_7
      value-from: "arn:aws:secretsmanager:ap-northeast-1:357457230521:secret:teamiz-ai/apprunner-env-0weS1b:NVIDIA_API_KEY_7::"
    - name: NVIDIA_API_KEY_8
      value-from: "arn:aws:secretsmanager:ap-northeast-1:357457230521:secret:teamiz-ai/apprunner-env-0weS1b:NVIDIA_API_KEY_8::"
