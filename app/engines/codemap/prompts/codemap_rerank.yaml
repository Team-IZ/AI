# D3 (2026-07-30): 프롬프트 파일 하나 = 스테이지 하나. 이 파일이 유일한 소스이고,
# app/prompt_manifest.json은 tools/build_prompt_manifest.py가 이 파일에서 생성한다 --
# manifest를 손으로 고치지 말 것(build --check가 드리프트를 잡는다).
#
# 키 이름은 app/prompt_manifest.json의 스테이지 객체 키(origin/feat/poc_full)와
# 정확히 1:1로 대응한다(id/title/kind/function/system/user_template/
# required_placeholders/optional_placeholders/truncation/params) -- 롤백 시
# 이 디렉터리를 지우고 손으로 만든 manifest만 남겨도 기존 소비자가 안 바뀌게 하려면
# 이름을 새로 짓지 않는게 맞다.

id: p05-1
pipeline: p05
title: 코드 중요도 재랭킹
kind: prompt
function: run_rerank_crew() -- app/engines/codemap/crew.py
system: >
  You review a shortlist of source files that a deterministic ranker already ordered by
  estimated importance for a code-ownership assessment. You may only reorder or relabel
  files that are already in the given candidate list -- never invent a file path that is
  not shown to you, and never claim to have seen files outside this list.
system_note: >
  D-poc10 원칙 계승: 줄 번호를 세지 말라고 명시한다 -- 실제 코드 한 줄을 인용하면
  우리가 그 줄을 찾는다(app/engines/shared/evidence.py::locate_symbol). 이 필드는
  문서화 전용이며 LLM에 실제로 전송되지 않는다(app/llm-stage.js::POCStage.call()이
  system_note를 쓰지 않는 것과 동일한 관행 -- system만 실제 시스템 메시지가 된다).
user_template: |
  아래는 결정론적 랭커(Tier 1)가 이미 중요도 순으로 정렬한 후보 파일 목록이다.
  각 항목의 순위(rank)와 그 근거(rank_evidence)를 참고해, 정말로 순서를 바꿀
  근거가 있을 때만 소폭 조정하라. 확신이 없으면 changes를 비워 Tier 1 순서를
  그대로 유지하는 것이 항상 안전한 선택이다.

  ## 저장소 요약
  {repo_summary_block}

  ## Tier 1 후보 목록 (path, rank, 근거)
  {candidates_block}

  ## 참고: 이 학생이 직접 작성/수정한 파일 (선택적 -- 없으면 빈 목록)
  {attribution_block}

  다음 JSON만 반환하라:
  {{
    "changes": [
      {{
        "path": "위 후보 목록에 있는 경로 그대로",
        "role": "ENTRY_POINT | ROUTING | DOMAIN_LOGIC | DATA_ACCESS | INTEGRATION | CONFIG | UI | TEST | UTIL 중 하나",
        "delta_rank": "정수. 이 파일의 순위를 몇 칸 올릴지(양수) 내릴지(음수)",
        "reason_code": "IMPORT_HUB | BUSINESS_LOGIC | RISK_SURFACE | ENTRY_POINT_CONFIRMED | REDUNDANT_WITH_HIGHER_RANK 중 하나"
      }}
    ]
  }}

  규칙:
  - path는 반드시 위 후보 목록에 있는 값을 그대로 복사해야 한다. 목록에 없는 경로를
    쓰면 그 항목은 전부 버려진다.
  - 확신 없는 항목은 changes에 넣지 않는다 -- 빈 배열도 유효한 답이다.
required_placeholders: [candidates_block]
optional_placeholders: [repo_summary_block, attribution_block]
truncation:
  candidates_block: 12000
  repo_summary_block: 2000
params:
  - key: max_tokens
    type: int
    default: 2000
  - key: temperature
    type: float
    default: 0.0
    locked: true
    note: "재현성 -- 같은 제출물은 같은 재랭킹이 나와야 비교가 성립한다"
