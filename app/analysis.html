<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코드 분석 · P04 통합 검증</title>
<link rel="stylesheet" href="../shared/iz-tokens.css">
<link rel="stylesheet" href="ui/poc.css">
<style>
  .wrap { max-width: 860px; }
  .card { background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--r-lg); padding: var(--sp-5); margin-bottom: var(--sp-4); }
  .card h3 { font-size: var(--fs-base); margin-bottom: var(--sp-3); }
  .frag { background: var(--c-code); border-radius: var(--r-md); padding: var(--sp-3); font-family: var(--mono); font-size: 12px; overflow-x: auto; white-space: pre; color: var(--c-code-text); margin-top: var(--sp-2); }
  .dp { border: 1px solid var(--c-border); border-radius: var(--r-md); padding: var(--sp-3); margin-bottom: var(--sp-3); }
  .dp .ref { font-family: var(--mono); font-size: 11px; color: var(--c-text-3); }
  .reqline { display: flex; align-items: flex-start; gap: var(--sp-2); padding: var(--sp-2) 0; border-bottom: 1px solid var(--c-border); font-size: var(--fs-sm); }
  .reqline:last-child { border-bottom: 0; }
  .topic { border: 1px solid var(--c-border); border-radius: var(--r-md); padding: var(--sp-4); margin-bottom: var(--sp-3); }
  .topic .th { display: flex; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-2); }
  .lvl { font-size: var(--fs-xs); color: var(--c-text-2); padding: 4px 0; }
  /* D-poc13 4단계: 심층 분석(p04-1b). 새 디자인 언어를 만들지 않는다 -- .dp 안쪽에
     들여쓴 한 덩어리로, 글자 크기·색은 바로 위 why_it_matters 줄(fs-xs / c-text-2)과 같게
     두고 왼쪽 경계선만 추가해 "이 지점에 딸린 부가 분석"임을 위치로 표현한다. */
  .dd { margin-top: var(--sp-3); padding-left: var(--sp-3); border-left: 2px solid var(--c-border); }
  .dd .ddh { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-xs); font-weight: 600; margin-bottom: var(--sp-2); }
  .dd p { font-size: var(--fs-xs); color: var(--c-text-2); line-height: 1.7; margin-bottom: var(--sp-2); }
  .dd .ddsec { font-size: 11px; font-weight: 600; color: var(--c-text-3); margin-top: var(--sp-2); }
  .dd ul { margin: 4px 0 0 16px; }
  .dd li { font-size: var(--fs-xs); color: var(--c-text-2); line-height: 1.6; }
</style>
</head>
<body>
<div class="tapp">
  <div class="ttop">
    <div class="l">
      <div class="brand"><span class="mk">◆</span>IZ 통합 검증 PoC</div>
      <div class="tnav"><a href="index.html">1 제출</a><a class="on">2 코드 분석</a><a>3 문답</a><a>4 보고서</a></div>
    </div>
    <div class="r"><span id="user-indicator">-</span></div>
  </div>
  <div class="wrap">

    <div class="step" id="step-progress">
      <div class="sh"><span class="n" id="progress-n">…</span> 코드 분석 진행</div>
      <div class="prog" id="prog-list"></div>
    </div>

    <div id="results" class="hidden">
      <div class="card">
        <h3>분석 문서</h3>
        <p id="doc-overview" style="font-size:var(--fs-sm);color:var(--c-text-2);line-height:1.7"></p>
        <div id="doc-decision-points" style="margin-top:var(--sp-4)"></div>
      </div>

      <div class="card">
        <h3>요구사항 P/F</h3>
        <div id="req-results"></div>
      </div>

      <div class="card">
        <h3>문제 <span id="topic-count"></span>개 <span class="badge mute" id="hint-mode-badge" style="font-weight:400"></span></h3>
        <div id="topics"></div>
      </div>

      <!-- D8: frozen/adaptive 비교를 위한 소요시간 -- 질문 생성은 항상, 힌트 사전생성은
           frozen일 때만(adaptive는 세션 중 발생하므로 report.html 쪽에서 봐야 함). -->
      <div class="card">
        <h3>소요시간 (질문·힌트 생성)</h3>
        <div id="timing-summary" style="font-size:var(--fs-sm);color:var(--c-text-2);margin-bottom:var(--sp-3)"></div>
        <div id="timing-detail" style="font-size:var(--fs-xs);color:var(--c-text-3)"></div>
      </div>

      <button class="cta" id="next-btn">문답 시작하기 →</button>
    </div>

    <div id="error-box" class="alertwarn hidden"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"
  integrity="sha384-tVslJOEkg7nVRW3Y3/ReGX0NnonNrbcmt1R5qFbQXQdGa2chRkoJYHAjAsv3zoTq"
  crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"
  integrity="sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG"
  crossorigin="anonymous"></script>
<script src="../shared/config.js"></script>
<script src="../shared/db.js"></script>
<script src="../shared/lab-core.js"></script>
<script src="../shared/llm.js"></script>
<script src="../shared/pyodide-shared.js"></script>
<script src="../shared/session-state.js"></script>
<script src="../shared/p02-engine.js"></script>
<script src="scoring-config.js"></script>
<script src="data/teaches-source.js"></script>
<script src="core/poc-state.js"></script>
<script src="stage2-analysis/code-fragment.js"></script>
<!-- D-poc13 (2026-08-03): 4단계 fan-out이 호출 직전 현재 rpm을 보고 K를 깎는다
     (CodeCandidates.readRate -> DebugTraffic.getCurrentRate). 이 태그가 없으면
     typeof DebugTraffic === "undefined"라 항상 "트래픽을 확인할 수 없음" 경로로 떨어져
     동시성 1 / K<=2로만 돌았다 -- 안전하긴 하지만 설계한 조절이 아예 작동하지 않는 상태다.
     LabConfig(config.js)와 LabLLM(llm.js)에 의존하므로 그 둘 뒤에 온다. -->
<script src="../shared/traffic-rate.js"></script>
<!-- D-poc13 (2026-08-03): 1~4단계(orderFilesByImportance / collectCandidates /
     groundCandidates / rankCandidates / runFanout). code-fragment.js 다음이어야 하는 건
     groundCandidates()/deepDiveCandidate()가 전역 CodeFragment를 기본 주입값으로 쓰기
     때문이고, llm-stage.js(POCStage)는 runFanout이 **호출 시점에** 참조하므로 순서 무관. -->
<!-- D-owncommit1 (2026-08-04): "누가 이 코드를 커밋했는가" 신호. P02Engine(githubRateLimitError
     재사용)와 LabConfig/LabDB 뒤, code-candidates.js보다 앞이면 순서상 충분하다(poc-engine.js가
     호출 시점에 전역으로 참조하므로 code-candidates.js와의 상대 순서 자체는 무관). -->
<script src="stage2-analysis/own-commit.js"></script>
<script src="stage2-analysis/code-candidates.js"></script>
<script src="stage3-session/question-guard.js"></script>
<script src="core/llm-stage.js"></script>
<script src="stage2-analysis/requirements.js"></script>
<script src="stage3-session/hint-ladder.js"></script>
<script src="core/poc-engine.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (v) => LabApp.escapeHtml(v);
  const STEPS = [
    { key: "fetch", label: "코드 가져오기 · 구조 스캔" },
    { key: "doc", label: "분석 문서 작성" },
    // D-poc13 4단계: 별도 항목으로 세운다. 최대 5회의 LLM 호출이 추가로 도는 구간이라
    // "분석 문서 작성"의 하위 문구로 숨기면 화면이 실제 비용을 감춘다. 트래픽 여유가 없어
    // 건너뛰면 이 항목은 그냥 다음 단계가 시작될 때 done으로 넘어간다(실패 표시 아님).
    { key: "deep", label: "핵심 위치 심층 분석 (상위 K개 병렬, 여유 없으면 생략)" },
    { key: "req", label: "요구사항 P/F 판정" },
    { key: "topics", label: "문제 선정" },
    { key: "hints", label: "질문·힌트 생성 (레벨당 2회 힌트 고정)" },
  ];
  let currentStepIdx = -1;

  function renderProgList() {
    $("prog-list").innerHTML = STEPS.map((s) =>
      `<div class="pstep wait" data-key="${s.key}"><span class="ic">•</span><div>${esc(s.label)}<div class="sub"></div></div></div>`
    ).join("");
  }

  function setStep(key, status, sub) {
    const el = document.querySelector(`.pstep[data-key="${key}"]`);
    if (!el) return;
    el.className = `pstep ${status}`;
    // D-poc11: now 상태는 정적 글리프가 아니라 회전 스피너(poc.css의 .spin) -- 오래 걸리는
    // LLM 호출 중에도 "멈춘 것"처럼 보이지 않게 한다.
    const ic = el.querySelector(".ic");
    if (status === "now") ic.innerHTML = `<span class="spin"></span>`;
    else ic.textContent = status === "done" ? "✓" : status === "error" ? "✕" : "•";
    if (sub !== undefined) el.querySelector(".sub").textContent = sub;
  }

  // hooks.onProgress 메시지의 접두 태그로 어느 STEPS 항목인지 추정해 체크리스트를 갱신한다.
  // 정확한 스테이지 콜백을 엔진에 새로 만들지 않고, 이미 있는 텍스트 로그를 재사용한다.
  function routeProgress(msg) {
    let key = null;
    if (msg.includes("[코드 스캔]") || msg.includes("가져오는 중")) key = "fetch";
    else if (msg.includes("분석 문서")) key = "doc";
    else if (msg.includes("심층 분석")) key = "deep";
    else if (msg.includes("요구사항")) key = "req";
    else if (msg.includes("문제 선정") || msg.includes("문제 ") && msg.includes("확보")) key = "topics";
    else if (msg.includes("질문") || msg.includes("힌트")) key = "hints";
    if (!key) return;
    const idx = STEPS.findIndex((s) => s.key === key);
    if (idx < currentStepIdx) return; // 이미 지난 단계로 역행하지 않음
    for (let i = 0; i < idx; i++) setStep(STEPS[i].key, "done");
    setStep(key, "now", msg);
    currentStepIdx = idx;
  }

  function finishAllDone() {
    STEPS.forEach((s) => setStep(s.key, "done"));
    $("progress-n").textContent = "✓";
  }

  function showFatalError(msg) {
    $("error-box").textContent = msg;
    $("error-box").classList.remove("hidden");
    const cur = STEPS[Math.max(0, currentStepIdx)];
    if (cur) setStep(cur.key, "error", msg);
  }

  // D8: frozen/adaptive 소요시간 비교. 합계·평균은 개수가 0이면 표시하지 않는다(나눗셈
  // NaN 방지 + "0건인데 0ms"로 오해하지 않게).
  function summarizeMs(list) {
    if (!list || !list.length) return null;
    const vals = list.map((x) => x.ms || 0);
    const sum = vals.reduce((a, b) => a + b, 0);
    return { count: vals.length, sum, avg: Math.round(sum / vals.length) };
  }

  function renderTiming(analysis) {
    const t = analysis.timing || {};
    const q = summarizeMs((t.questionGenMs || []).map((ms) => ({ ms })));
    const h = summarizeMs(t.frozenHintGenMs || []);

    const parts = [];
    if (q) parts.push(`질문 생성 ${q.count}건 · 합계 ${(q.sum / 1000).toFixed(1)}초 · 평균 ${q.avg}ms`);
    if (analysis.hintMode === "frozen") {
      parts.push(h
        ? `힌트 사전생성 ${h.count}건 · 합계 ${(h.sum / 1000).toFixed(1)}초 · 평균 ${h.avg}ms`
        : "힌트 사전생성: 기록 없음");
    } else {
      parts.push("힌트는 적응형 모드라 세션 중 생성됩니다 -- 소요시간은 문답 화면과 보고서에서 확인.");
    }
    $("timing-summary").innerHTML = parts.map((p) => esc(p)).join("<br>");

    if (analysis.hintMode === "frozen" && t.frozenHintGenMs && t.frozenHintGenMs.length) {
      $("timing-detail").innerHTML = t.frozenHintGenMs
        .map((x) => `${esc(POCScoring.AXES[x.axis] ? POCScoring.AXES[x.axis].label : x.axis)} · 힌트${x.lv}: ${x.ms}ms`)
        .join(" &nbsp;·&nbsp; ");
    } else {
      $("timing-detail").textContent = "";
    }
  }

  // ── 렌더 ────────────────────────────────────────────────────────────────────
  // D-poc13 4단계: deep_dive(p04-1b)가 붙은 decision point만 이 블록이 추가로 그려진다.
  // **없으면 빈 문자열을 돌려주고, 그 항목의 렌더는 오늘과 한 글자도 다르지 않다** --
  // 심층 분석 실패/생략이 화면에서 "고장"으로 보이지 않아야 한다는 설계 계약
  // (app/code-candidates.js 4단계 규칙 4)의 화면 쪽 절반이다. 그래서 실패를 알리는 문구도
  // 여기 넣지 않는다: 실패는 진행 로그(routeProgress)에만 남는다.
  //   비어 있는 필드는 통째로 생략한다(빈 제목만 떠 있는 상자를 만들지 않는다).
  function deepDiveHtml(dd) {
    if (!dd) return "";
    const parts = [];
    if (dd.what_it_does) parts.push(`<p>${esc(dd.what_it_does)}</p>`);
    if (dd.why_this_way) parts.push(`<p>${esc(dd.why_this_way)}</p>`);
    if (dd.alternatives && dd.alternatives.length) {
      parts.push(`<div class="ddsec">다른 구현이었다면</div><ul>` + dd.alternatives
        .map((a) => `<li><b>${esc(a.approach)}</b>${a.tradeoff ? ` — ${esc(a.tradeoff)}` : ""}</li>`)
        .join("") + `</ul>`);
    }
    if (dd.failure_modes && dd.failure_modes.length) {
      parts.push(`<div class="ddsec">깨지는 경우</div><ul>` + dd.failure_modes
        .map((f) => `<li>${esc(f)}</li>`).join("") + `</ul>`);
    }
    if (!parts.length) return "";
    // ref/rank는 "이 심층 분석이 정확히 어느 줄을 보고 나온 것인가"를 화면에서도 확인할 수
    // 있게 하는 근거 표기다(D-poc6/D-poc10). 위 .ref 줄과 같은 mono/badge 어휘를 그대로 쓴다.
    const meta = [dd.ref ? esc(dd.ref) : null, dd.rank ? `랭크 ${dd.rank}` : null]
      .filter(Boolean).join(" · ");
    return `<div class="dd"><div class="ddh">심층 분석
      ${meta ? `<span class="badge mute mono" style="font-weight:400">${meta}</span>` : ""}</div>
      ${parts.join("")}</div>`;
  }

  function renderResults(analysis) {
    $("doc-overview").textContent = analysis.analysisDoc.overview || "";
    $("doc-decision-points").innerHTML = (analysis.decisionPoints || []).map((dp) => {
      const badge = dp.fragment.valid ? `<span class="badge ok">근거 확인됨</span>` : `<span class="badge bad">근거 무효</span>`;
      const ref = dp.fragment.valid ? CodeFragment.formatRef(dp.fragment) : `${dp.file || "?"}:${(dp.lines || []).join("-")}`;
      const body = dp.fragment.valid ? `<div class="frag">${esc(dp.fragment.text)}</div>` : "";
      return `<div class="dp"><div class="th"><b>${esc(dp.title || "")}</b> ${badge}</div>
        <div class="ref">${esc(ref)}</div>
        <div style="font-size:var(--fs-xs);color:var(--c-text-2);margin-top:4px">${esc(dp.why_it_matters || "")}</div>
        ${body}${deepDiveHtml(dp.deep_dive)}</div>`;
    }).join("") || `<div class="fwarn">근거 있는 decision point가 없습니다.</div>`;

    const reqEl = $("req-results");
    if (!analysis.requirementsResult.length) {
      reqEl.innerHTML = `<div class="fwarn">요구사항 없음(1단계에서 비워둠)</div>`;
    } else {
      reqEl.innerHTML = analysis.requirementsResult.map((r) => {
        const badge = r.verdict === "P" ? `<span class="badge ok">P</span>` : `<span class="badge bad">F</span>`;
        return `<div class="reqline">${badge}<div><b>${esc(r.requirement)}</b>
          ${r.evidence && r.evidence.file ? `<div class="ref mono">${esc(r.evidence.file)}${r.evidence.lines ? ":" + r.evidence.lines.join("-") : ""}</div>` : ""}
          ${r.note ? `<div style="font-size:var(--fs-xs);color:var(--c-text-3)">${esc(r.note)}</div>` : ""}
          </div></div>`;
      }).join("");
    }

    $("topic-count").textContent = analysis.questionSets.length;
    $("hint-mode-badge").textContent = analysis.hintMode === "adaptive" ? "힌트: 적응형" : "힌트: 동결";
    $("topics").innerHTML = analysis.questionSets.map((qs, i) => {
      if (qs.flagged) {
        return `<div class="topic"><div class="th"><b>${i + 1}. ${esc(qs.topic.title)}</b><span class="badge warn">flagged</span></div>
          <div class="fwarn danger">질문 생성이 선택지 금지 규칙을 계속 위반했습니다. 이 문제는 검토가 필요합니다.</div></div>`;
      }
      const levels = qs.levels.map((l) => {
        const axis = POCScoring.AXES[l.axis];
        return `<div class="lvl"><b>${esc(axis.label)}</b> — ${esc(l.question)}</div>`;
      }).join("");
      return `<div class="topic"><div class="th"><b>${i + 1}. ${esc(qs.topic.title)}</b>
        <span class="badge mute mono">${esc(CodeFragment.formatRef(qs.code_ref))}</span></div>${levels}</div>`;
    }).join("");

    renderTiming(analysis);
    $("results").classList.remove("hidden");
  }

  // ── 실행 ────────────────────────────────────────────────────────────────────
  async function run() {
    renderProgList();
    const setup = POCState.loadSetup();
    if (!setup) { showFatalError("제출 정보가 없습니다 — 1단계부터 다시 시작하세요."); return; }

    setStep("fetch", "now");
    try {
      const analysis = await POCEngine.runAnalysisStage(setup, {
        onProgress: routeProgress,
        onStatus: (text, kind) => { if (kind === "error") showFatalError(text); },
      });
      finishAllDone();
      renderResults(analysis);
      POCState.saveAnalysis(analysis);
      $("next-btn").addEventListener("click", () => { location.href = "session.html"; });
    } catch (err) {
      console.error(err);
      showFatalError(`오류: ${err.message}`);
    }
  }

  (async function init() {
    try {
      const member = await LabDB.currentMemberOrNull();
      $("user-indicator").textContent = member ? member.email : "로그인 안 됨";
    } catch (_) { $("user-indicator").textContent = "로그인 안 됨"; }
    try {
      await POCStage.ensureManifestLoaded();
    } catch (err) {
      showFatalError(`매니페스트 로드 실패: ${err.message}`);
      return;
    }
    run();
  })();
})();
</script>
</body>
</html>
