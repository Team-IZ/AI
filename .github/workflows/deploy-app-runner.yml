name: Deploy to App Runner

on:
  push:
    branches: [main]

# 배포 도중 새 push가 들어와도 진행 중인 배포는 끝까지 -- 취소하면 ECR에 반쪽 이미지가 남을 수 있다.
concurrency:
  group: deploy-app-runner
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  deploy:
    name: Build & push to ECR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 장기 자격증명(액세스키)을 저장하지 않고 OIDC로 짧은 수명 토큰만 발급받는다.
      # 이 역할은 repo:Team-IZ/AI:ref:refs/heads/main 에서만 assume 가능하도록
      # 신뢰정책에 스코프가 걸려 있다.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::357457230521:role/github-actions-teamiz-ai-deploy
          aws-region: ap-northeast-1

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # App Runner의 컨테이너 이미지 배포는 amd64만 지원한다(아키텍처 선택 옵션이 API에 없음).
      # GitHub 러너는 기본이 amd64라 --platform 없이도 맞지만, 명시해서 사고를 원천 차단한다.
      #
      # D2: :latest와 커밋 SHA 태그를 같이 민다.
      #   WHY: :latest 하나뿐이면 나쁜 배포가 들어왔을 때 되돌릴 대상 태그가 없다.
      #   COST: ECR 저장 공간이 태그 수만큼 늘어난다(태그 자체는 무료지만 이미지가 안 지워짐).
      #   EXIT: 사고 시 ImageIdentifier를 `:<sha>`로 바꿔 update-service 한 번이면 롤백된다.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/teamiz-ai:latest
            ${{ steps.ecr-login.outputs.registry }}/teamiz-ai:${{ github.sha }}

      # D1: 배포를 App Runner의 AutoDeploymentsEnabled(암묵적 EventBridge 트리거)에 맡기지 않고
      # 이 워크플로가 직접 확정짓는다.
      #   WHY: App Runner는 서비스가 PAUSED인 동안 들어온 새 이미지를 resume 시점에도 자동배포
      #        안 함(AWS 공식 문서, Team-IZ/Backend PR#81에서 실제 재현+확인됨). 이 서비스도
      #        동일한 request-based idle-pause를 쓰므로(20분 무요청 시 자동정지) 같은 갭이
      #        구조적으로 존재함.
      #   COST: GitHub Actions 역할에 apprunner:ResumeService/StartDeployment/ListOperations/
      #        UpdateService + secretsmanager:DescribeSecret 권한 필요(이 서비스/시크릿 한정).
      #        resume이 필요하면 배포에 최대 1분 내외 추가.
      #
      # D3: deploy-env.json + 시크릿 9종을 매 배포마다 update-service로 실제 적용한다.
      #   WHY: apprunner.yaml(관리형 런타임 시절 정본)을 지운 뒤 deploy-env.json을 그 대체
      #        정본으로 뒀는데, 처음엔 이 스텝이 start-deployment만 하고 그 파일을 실제로는
      #        아무 데도 안 밀어넣었다 -- 파일은 코드 기본값과의 드리프트 테스트만 통과시키는
      #        장식이고, 라이브 서비스 설정(콘솔에서 최초 1회 수동 입력한 값)과 갈라질 수
      #        있었다. MODEL_CODE_SESSION이 배포본에만 옛 값으로 남았던 사고(D-model1,
      #        2026-08-07)가 이 구조에서 그대로 재현 가능했다 — 리뷰에서 지적받고 고침.
      #        시크릿 참조도 여기 명시해서 "어떤 키가 필요한지"가 다시 git에 남게 된다
      #        (apprunner.yaml 삭제로 저장소에서 사라졌던 것).
      #   COST: 매 배포가 이미지 교체뿐 아니라 설정 전체를 다시 확정짓는 update-service를
      #        한 번 더 거친다 — 몇 초 늘어남.
      #   EXIT: 콘솔에서 직접 바꾼 값이 있으면 다음 배포에서 deploy-env.json 값으로 덮인다
      #        (의도된 동작 — 정본은 항상 이 파일이어야 드리프트가 재발 안 함).
      #
      # 🔴 AuthenticationConfiguration(AccessRoleArn)을 여기 싣지 않는다 -- 실으면 AWS가
      #    `iam:PassRole`을 요구하는데 배포 역할에 그 권한이 없어 update-service가 통째로
      #    AccessDeniedException으로 죽는다(2026-08-11 실제 배포 실패). ECR 접근 역할은
      #    서비스에 이미 설정돼 있고 update-service는 **안 보낸 항목을 그대로 둔다**.
      #    다시 넣고 싶으면 배포 역할에 iam:PassRole(조건 iam:PassedToService=
      #    apprunner.amazonaws.com)을 먼저 붙여야 한다.
      - name: Deploy to App Runner
        env:
          SERVICE_ARN: arn:aws:apprunner:ap-northeast-1:357457230521:service/teamiz-ai-container/4f7a3601fbda4e09b2e9a8303f70b8f0
          SECRET_ID: teamiz-ai/apprunner-env
          IMAGE_URI: ${{ steps.ecr-login.outputs.registry }}/teamiz-ai:${{ github.sha }}
        run: |
          set -euo pipefail

          # D-wait-timeout(2026-08-21): 8초 간격으로 40회(320초)만 기다리고 포기했는데,
          # 실측 배포 소요시간은 618초였다(오늘 이 서비스, update-service 뒤 RUNNING까지).
          # CI는 "실패"로 찍었지만 AWS 쪽 UPDATE_SERVICE 오퍼레이션은 그 뒤에도 계속
          # 진행돼 결국 SUCCEEDED로 끝났다 — 배포가 죽은 게 아니라 지켜보는 쪽이 먼저
          # 포기한 것이었다. 8/14 배포도 같은 지점에서 같은 방식으로 실패한 기록이 있어
          # 이번이 우연이 아니라 이 타임아웃이 구조적으로 짧다는 뜻이다.
          #   WHY: 900초(=618초 실측치의 약 1.5배 여유)로 올린다. 반복 횟수가 아니라
          #        간격(8초)으로 나눈 값을 쓰는 이유는 다음에 간격을 조정해도 "몇 분
          #        기다리는가"가 숫자만 봐도 바로 드러나게 하려는 것이다.
          #   COST: 정말로 죽은 배포(응답 없는 컨테이너 등)를 판정하는 데 최대 15분이
          #        걸린다 — 실패를 더 늦게 안다는 뜻이다.
          #   EXIT: 실측 소요시간이 더 늘어나면(이미지가 커지거나 헬스체크가 느려지면)
          #        WAIT_TIMEOUT_S만 다시 올린다. 반대로 배포가 꾸준히 훨씬 빨리 끝나면
          #        낮춰서 진짜 실패를 더 빨리 알 수 있게 한다.
          WAIT_TIMEOUT_S=900
          WAIT_INTERVAL_S=8

          wait_for_running() {
            local waited=0
            while [ "$waited" -lt "$WAIT_TIMEOUT_S" ]; do
              STATUS=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" --query 'Service.Status' --output text)
              [ "$STATUS" = "RUNNING" ] && return 0
              sleep "$WAIT_INTERVAL_S"
              waited=$((waited + WAIT_INTERVAL_S))
            done
            return 1
          }

          STATUS=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" --query 'Service.Status' --output text)
          echo "Current service status: $STATUS"

          if [ "$STATUS" = "PAUSED" ]; then
            echo "Service is paused, resuming..."
            aws apprunner resume-service --service-arn "$SERVICE_ARN" >/dev/null
          fi

          if ! wait_for_running; then
            echo "Service did not reach RUNNING in time (status: $STATUS)"
            exit 1
          fi

          # deploy-env.json(평문 env) + Secrets Manager의 시크릿 9종을 실제로 적용.
          # ARN은 이름으로 매번 조회한다 -- 시크릿이 재생성돼 접미어가 바뀌어도 하드코딩된
          # ARN이 조용히 stale해지는 사고를 피한다.
          SECRET_ARN=$(aws secretsmanager describe-secret --secret-id "$SECRET_ID" --query ARN --output text)
          SECRETS_JSON=$(jq -n --arg arn "$SECRET_ARN" '
            ["INTERNAL_API_KEY","NVIDIA_API_KEY_1","NVIDIA_API_KEY_2","NVIDIA_API_KEY_3",
             "NVIDIA_API_KEY_4","NVIDIA_API_KEY_5","NVIDIA_API_KEY_6","NVIDIA_API_KEY_7",
             "NVIDIA_API_KEY_8"]
            | map({(.): ($arn + ":" + . + "::")}) | add')

          jq -n \
            --arg arn "$SERVICE_ARN" \
            --arg image "$IMAGE_URI" \
            --argjson env "$(cat deploy-env.json)" \
            --argjson secrets "$SECRETS_JSON" \
            '{
              ServiceArn: $arn,
              SourceConfiguration: {
                ImageRepository: {
                  ImageIdentifier: $image,
                  ImageRepositoryType: "ECR",
                  ImageConfiguration: {
                    Port: "8080",
                    RuntimeEnvironmentVariables: $env,
                    RuntimeEnvironmentSecrets: $secrets
                  }
                },
                AutoDeploymentsEnabled: false
              }
            }' > /tmp/update-service-input.json

          aws apprunner update-service --region ap-northeast-1 \
            --cli-input-json file:///tmp/update-service-input.json \
            --query 'Service.Status' --output text

          # 2026-08-21 실측: 바로 이 대기가 618초 걸렸다(위 D-wait-timeout 참고).
          if ! wait_for_running; then
            echo "Service did not reach RUNNING after update-service (status: $STATUS)"
            exit 1
          fi

          OP_ID=$(aws apprunner start-deployment --service-arn "$SERVICE_ARN" --query 'OperationId' --output text)
          echo "Started deployment operation: $OP_ID"

          op_waited=0
          while [ "$op_waited" -lt "$WAIT_TIMEOUT_S" ]; do
            OP_STATUS=$(aws apprunner list-operations --service-arn "$SERVICE_ARN" --max-results 5 \
              --query "OperationSummaryList[?Id=='$OP_ID'].Status" --output text)
            case "$OP_STATUS" in
              SUCCEEDED)
                echo "Deployment succeeded."
                exit 0
                ;;
              FAILED|ROLLBACK_FAILED|ROLLBACK_SUCCEEDED)
                echo "Deployment did not succeed (status: $OP_STATUS) -- check CloudWatch logs."
                exit 1
                ;;
            esac
            sleep "$WAIT_INTERVAL_S"
            op_waited=$((op_waited + WAIT_INTERVAL_S))
          done
          echo "Timed out waiting for deployment $OP_ID to finish"
          exit 1
