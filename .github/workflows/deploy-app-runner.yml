name: Deploy to App Runner

on:
  push:
    branches: [main]

# 배포 도중 새 push가 들어와도 진행 중인 배포는 끝까지 -- 취소하면 ECR에 반쪽 이미지가 남을 수 있다.
concurrency:
  group: deploy-app-runner
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  deploy:
    name: Build & push to ECR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 장기 자격증명(액세스키)을 저장하지 않고 OIDC로 짧은 수명 토큰만 발급받는다.
      # 이 역할은 repo:Team-IZ/AI:ref:refs/heads/main 에서만 assume 가능하도록
      # 신뢰정책에 스코프가 걸려 있다.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::357457230521:role/github-actions-teamiz-ai-deploy
          aws-region: ap-northeast-1

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # App Runner의 컨테이너 이미지 배포는 amd64만 지원한다(아키텍처 선택 옵션이 API에 없음).
      # GitHub 러너는 기본이 amd64라 --platform 없이도 맞지만, 명시해서 사고를 원천 차단한다.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/teamiz-ai:latest

      # D1: 배포를 App Runner의 AutoDeploymentsEnabled(암묵적 EventBridge 트리거)에 맡기지 않고
      # 이 워크플로가 직접 확정짓는다.
      #   WHY: App Runner는 서비스가 PAUSED인 동안 들어온 새 이미지를 resume 시점에도 자동배포
      #        안 함(AWS 공식 문서, Team-IZ/Backend PR#81에서 실제 재현+확인됨). 이 서비스도
      #        동일한 request-based idle-pause를 쓰므로(20분 무요청 시 자동정지) 같은 갭이
      #        구조적으로 존재함.
      #   COST: GitHub Actions 역할에 apprunner:ResumeService/StartDeployment/ListOperations
      #        권한 필요(이 서비스 ARN 한정). resume이 필요하면 배포에 최대 1분 내외 추가.
      - name: Deploy to App Runner
        env:
          SERVICE_ARN: arn:aws:apprunner:ap-northeast-1:357457230521:service/teamiz-ai-container/4f7a3601fbda4e09b2e9a8303f70b8f0
        run: |
          set -euo pipefail

          STATUS=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" --query 'Service.Status' --output text)
          echo "Current service status: $STATUS"

          if [ "$STATUS" = "PAUSED" ]; then
            echo "Service is paused, resuming..."
            aws apprunner resume-service --service-arn "$SERVICE_ARN" >/dev/null
          fi

          for i in $(seq 1 40); do
            STATUS=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" --query 'Service.Status' --output text)
            [ "$STATUS" = "RUNNING" ] && break
            sleep 8
          done
          if [ "$STATUS" != "RUNNING" ]; then
            echo "Service did not reach RUNNING in time (status: $STATUS)"
            exit 1
          fi

          OP_ID=$(aws apprunner start-deployment --service-arn "$SERVICE_ARN" --query 'OperationId' --output text)
          echo "Started deployment operation: $OP_ID"

          for i in $(seq 1 60); do
            OP_STATUS=$(aws apprunner list-operations --service-arn "$SERVICE_ARN" --max-results 5 \
              --query "OperationSummaryList[?Id=='$OP_ID'].Status" --output text)
            case "$OP_STATUS" in
              SUCCEEDED)
                echo "Deployment succeeded."
                exit 0
                ;;
              FAILED|ROLLBACK_FAILED|ROLLBACK_SUCCEEDED)
                echo "Deployment did not succeed (status: $OP_STATUS) -- check CloudWatch logs."
                exit 1
                ;;
            esac
            sleep 8
          done
          echo "Timed out waiting for deployment $OP_ID to finish"
          exit 1
