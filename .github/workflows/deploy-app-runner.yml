name: Deploy to App Runner

on:
  push:
    branches: [main]

# 배포 도중 새 push가 들어와도 진행 중인 배포는 끝까지.
concurrency:
  group: deploy-app-runner
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to App Runner
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      SERVICE_ARN: arn:aws:apprunner:ap-northeast-1:357457230521:service/teamiz-ai/aa5ccfcc2d894cb5a2c2ad7c63bcfe3c
    steps:
      # 장기 자격증명 없이 OIDC로 짧은 수명 토큰만 발급받는다. 이 역할은
      # repo:Team-IZ/AI:ref:refs/heads/main 에서만 assume 가능하도록 스코프가 걸려 있다.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::357457230521:role/github-actions-teamiz-ai-deploy
          aws-region: ap-northeast-1

      # D1: 이 서비스는 App Runner의 GitHub 연동(CodeRepository/apprunner.yaml)으로 소스에서
      # 직접 빌드되므로 여기서 별도로 체크아웃/빌드하지 않는다 -- App Runner 자신이 GitHub에서
      # 코드를 가져온다. 이 워크플로의 역할은 오직 "배포를 확정짓는 것"뿐이다.
      #   WHY: App Runner의 AutoDeploymentsEnabled는 서비스가 PAUSED인 동안 들어온 push를
      #        resume 후에도 자동배포 안 함(AWS 공식문서, Team-IZ/Backend에서 실제 재현+확인
      #        됨 -- PR Team-IZ/Backend#81 참조). 이 서비스도 동일한 request-based idle-pause를
      #        쓰므로(20분 무요청 시 자동정지) 같은 갭이 구조적으로 존재함.
      #   COST: GitHub Actions 역할에 apprunner:ResumeService/StartDeployment/ListOperations
      #        권한 추가(이 서비스 ARN 한정). resume이 필요하면 배포에 최대 1분 내외 추가.
      #   EXIT: pause 자동화를 완전히 없애면(24/7 상시) 이 스텝 없이 AutoDeploymentsEnabled만
      #        으로 되돌려도 안전함 -- 그래도 이 스텝은 중복 확인일 뿐 해가 되지 않음.
      - name: Deploy to App Runner
        run: |
          set -euo pipefail

          STATUS=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" --query 'Service.Status' --output text)
          echo "Current service status: $STATUS"

          if [ "$STATUS" = "PAUSED" ]; then
            echo "Service is paused, resuming..."
            aws apprunner resume-service --service-arn "$SERVICE_ARN" >/dev/null
          fi

          for i in $(seq 1 40); do
            STATUS=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" --query 'Service.Status' --output text)
            [ "$STATUS" = "RUNNING" ] && break
            sleep 8
          done
          if [ "$STATUS" != "RUNNING" ]; then
            echo "Service did not reach RUNNING in time (status: $STATUS)"
            exit 1
          fi

          OP_ID=$(aws apprunner start-deployment --service-arn "$SERVICE_ARN" --query 'OperationId' --output text)
          echo "Started deployment operation: $OP_ID"

          for i in $(seq 1 60); do
            OP_STATUS=$(aws apprunner list-operations --service-arn "$SERVICE_ARN" --max-results 5 \
              --query "OperationSummaryList[?Id=='$OP_ID'].Status" --output text)
            case "$OP_STATUS" in
              SUCCEEDED)
                echo "Deployment succeeded."
                exit 0
                ;;
              FAILED|ROLLBACK_FAILED|ROLLBACK_SUCCEEDED)
                echo "Deployment did not succeed (status: $OP_STATUS) -- check CloudWatch logs."
                exit 1
                ;;
            esac
            sleep 8
          done
          echo "Timed out waiting for deployment $OP_ID to finish"
          exit 1
