name: AI service CI

# Phase 0 (2026-07-30): 이 저장소에는 그동안 워크플로가 없었다(이슈/PR 템플릿뿐).
# code-importance-map 스테이지부터 두 가지 게이트(D3/D4의 AST 린터, D9의 시크릿
# 가드)가 새로 생기므로 여기서 CI 자체를 만든다. 나중에 prompt-drift job이
# 추가된다(Phase 6, D5).
#
# D1 (2026-07-31, app/engines/codemap/crew.py 모듈 docstring): crewai를 완전히 제거했다 --
# Tier 2 재랭킹도 이제 shared.llm.chat()만 쓴다. requirements-codemap.txt는 참고용으로만
# 남아 있고(git 이력에 crewai 기반 구현이 있음), 이 파일을 설치해서 도는 별도 CI job은
# 더 이상 없다(이전에는 `test-codemap` job이 있었으나 crewai 의존 테스트 자체가 없어져
# 폐기 -- git 이력에서 찾을 수 있음).

on:
  push:
    branches: [feature/code-importance-map, develop]
  pull_request:
    branches: [feature/code-importance-map, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: AST lint (D3 PROMPT001 / D4 LLM001)
        run: python3 tools/lint_llm_calls.py app
      - name: Secret guard (D9)
        run: python3 tools/check_no_secrets.py --tracked

  prompt-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML>=6,<7
      - name: manifest drift check (D3-2 -- YAML은 소스, JSON은 생성물)
        run: ./tools/rebuild_codemap_manifest.sh --check
