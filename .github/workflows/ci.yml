name: AI service CI

# Phase 0 (2026-07-30): 이 저장소에는 그동안 워크플로가 없었다(이슈/PR 템플릿뿐).
# code-importance-map 스테이지부터 두 가지 게이트(D3/D4의 AST 린터, D9의 시크릿
# 가드)가 새로 생기므로 여기서 CI 자체를 만든다. 나중에 prompt-drift job이
# 추가된다(Phase 6, D5).
#
# Phase 4: `test`(기본) job은 일부러 requirements-codemap.txt를 설치하지 않는다 --
# crewai 없이도 서비스 전체가 돌아가야 한다는 게 그 파일을 분리한 이유다. crewai
# 의존 테스트(tests/test_codemap_crew.py의 TestDefaultKickoffCrewAiWiring)는
# 이 job에서 자동으로 스킵되고, 아래 `test-codemap` job에서만 실행된다.

on:
  push:
    branches: [feature/code-importance-map, develop]
  pull_request:
    branches: [feature/code-importance-map, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest

  test-codemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-codemap.txt
      - name: pytest incl. crewai-dependent tests
        run: pytest tests/test_codemap_crew.py -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: AST lint (D3 PROMPT001 / D4 LLM001)
        run: python3 tools/lint_llm_calls.py app
      - name: Secret guard (D9)
        run: python3 tools/check_no_secrets.py --tracked

  prompt-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML>=6,<7
      - name: manifest drift check (D3-2 -- YAML은 소스, JSON은 생성물)
        run: ./tools/rebuild_codemap_manifest.sh --check
