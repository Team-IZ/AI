# D-P01ORCH: separate Worker from worker/nvidia-proxy.js (that file is shared with
# code-qna and kept simple/stable -- this one owns curriculum-manager's chunk-analysis
# orchestration and a Durable Object, and calls nvidia-proxy.js as a normal external
# HTTP dependency, same submit-and-poll contract the browser used to call directly).
# WHY: lets an in-progress P01 analysis keep advancing while the browser that submitted
#   it is fully closed (no JS runtime alive in-browser can do that -- only server-side
#   execution can), and gives true per-run isolation for concurrent analyses using
#   different NVIDIA keys (one Durable Object instance = one job = fully isolated state,
#   for free -- p01-runner.js hardcodes pipelineId="p01" internally so two in-browser
#   runs can never be told apart without editing that shared file, which is off-limits).
# COST: new Durable Objects primitive (Workers Paid plan -- already active on this
#   account since 2026-07-22, confirmed live, no new fixed cost).
# EXIT: to retire this, point curriculum-manager's index.html back at P01Runner.run()
#   directly (git revert) -- no data migration needed, pdf_analysis.runs/artifacts are
#   unchanged shape.
name = "p01-orchestrator"
main = "index.js"
compatibility_date = "2026-07-24"

[[durable_objects.bindings]]
class_name = "P01AnalysisJob"
name = "P01_JOBS"

[[migrations]]
new_sqlite_classes = ["P01AnalysisJob"]
tag = "v1"
