# D208-worker: dedicated deployment for Team-IZ/AI's feat/code_Q&A branch -- separate
# name/KV namespace/queue from both the original nvidia-proxy (popixoxipop-collab) and
# team-iz-nvidia-proxy (Team-IZ curriculum-manager task), so an incident or config change
# in either of those never affects this one. Worker code (nvidia-proxy.js) is an unmodified
# copy -- only bindings differ, matching env.NVIDIA_JOBS/env.NVIDIA_JOBS_QUEUE the code
# already expects.
name = "team-iz-code-qna-proxy"
main = "nvidia-proxy.js"
compatibility_date = "2026-07-14"

kv_namespaces = [
  { binding = "NVIDIA_JOBS", id = "4ef68f0d221949849ede364f39e8214b" }
]

[[queues.producers]]
queue = "team-iz-code-qna-jobs-queue"
binding = "NVIDIA_JOBS_QUEUE"

[[queues.consumers]]
queue = "team-iz-code-qna-jobs-queue"
max_batch_size = 1
max_batch_timeout = 1
